services:
  - type: web
    name: ku-open-data-analytics-api
    runtime: python
    repo: https://github.com/thanitpu/KU2A-Analytics
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: https://thanitpu.github.io,https://raw.githack.com,http://localhost:8000,http://127.0.0.1:8000
