name: Data Acquisition Q-diving Live Validation

on:
  push:
    branches:
      - integration/data-acquisition-platform
    paths:
      - 'services/data-acquisition/acquisition/qdiving_techniques.py'
      - 'services/data-acquisition/tools/LIVE_QDIVING_PADI_PROBE.py'
      - 'services/data-acquisition/tools/SELF_TEST_QDIVING_PADI_v0.1.py'
      - '.github/workflows/data-acquisition-qdiving-live.yml'
  workflow_dispatch:

jobs:
  padi-public-content:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-acquisition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Deterministic Q-diving regression
        env:
          PYTHONPATH: .
        run: python tools/SELF_TEST_QDIVING_PADI_v0.1.py
      - name: Explore and repeat-audit PADI public feed/index
        env:
          PYTHONPATH: .
        run: python tools/LIVE_QDIVING_PADI_PROBE.py --repeat-delay 8 --max-items 25 --output validation/qdiving-padi-live.json
      - name: Upload Q-diving evidence
        uses: actions/upload-artifact@v4
        with:
          name: ku2d-qdiving-padi-live
          path: services/data-acquisition/validation/qdiving-padi-live.json
          if-no-files-found: error
          retention-days: 14
