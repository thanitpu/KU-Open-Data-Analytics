name: Apply PR1 fixes
on:
  push:
    branches: [feature/data-workspace-v0.2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""function parseDelimited(text){const lines=text.replace(/^\\uFEFF/,'').split(/\\r?\\n/).filter(x=>x.trim());if(lines.length<2)throw Error('Please provide a header and at least one data row.');const delimiter=lines[0].includes('\\t')?'\\t':',';const split=l=>l.split(delimiter).map(x=>x.trim());headers=split(lines[0]);data=lines.slice(1).map(l=>{const a=split(l),o={};headers.forEach((h,i)=>o[h]=a[i]??'');return o});inferMetadata();render()}"""
          new="""function detectDelimiter(text){const first=(text.split(/\\r?\\n/).find(x=>x.trim())||'');const counts=[[',',(first.match(/,/g)||[]).length],['\\t',(first.match(/\\t/g)||[]).length],[';',(first.match(/;/g)||[]).length]].sort((a,b)=>b[1]-a[1]);return counts[0][1]>0?counts[0][0]:','}function parseDelimitedRows(text,delimiter){const rows=[];let row=[],cell='',quoted=false;const src=text.replace(/^\\uFEFF/,'');for(let i=0;i<src.length;i++){const ch=src[i];if(ch==='\"'){if(quoted&&src[i+1]==='\"'){cell+='\"';i++}else quoted=!quoted}else if(ch===delimiter&&!quoted){row.push(cell.trim());cell=''}else if((ch==='\\n'||ch==='\\r')&&!quoted){if(ch==='\\r'&&src[i+1]==='\\n')i++;row.push(cell.trim());cell='';if(row.some(v=>v!==''))rows.push(row);row=[]}else cell+=ch}row.push(cell.trim());if(row.some(v=>v!==''))rows.push(row);return rows}function normalizeHeaders(raw){const used={};return raw.map((value,i)=>{const base=String(value??'').trim()||`Variable_${i+1}`;used[base]=(used[base]||0)+1;return used[base]===1?base:`${base}_${used[base]}`})}function parseDelimited(text){const delimiter=detectDelimiter(text);const rows=parseDelimitedRows(text,delimiter);if(rows.length<2)throw Error('Please provide a header and at least one data row.');headers=normalizeHeaders(rows[0]);data=rows.slice(1).map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]??'');return o});inferMetadata();render()}"""
          assert old in s
          s=s.replace(old,new)
          s=s.replace("headers=rows[0].map((h,i)=>String(h??'').trim()||`Variable_${i+1}`);","headers=normalizeHeaders(rows[0]);")
          old2="""h+=`<tr><td class=\"variable-name\">${esc(name)}</td><td><input type=\"text\" value=\"${esc(meta[name].label)}\" placeholder=\"Optional label\" onchange=\"updateLabel('${encodeURIComponent(name)}',this.value)\"></td><td>${esc(meta[name].storage)}</td><td><select onchange=\"updateLevel('${encodeURIComponent(name)}',this.value)\">${['Nominal','Ordinal','Scale'].map(v=>`<option ${meta[name].level===v?'selected':''}>${v}</option>`).join('')}</select></td><td>${unique}</td><td>${missing}</td></tr>`"""
          new2="""const idx=headers.indexOf(name);h+=`<tr><td class=\"variable-name\">${esc(name)}</td><td><input type=\"text\" value=\"${esc(meta[name].label)}\" placeholder=\"Optional label\" onchange=\"updateLabelByIndex(${idx},this.value)\"></td><td>${esc(meta[name].storage)}</td><td><select onchange=\"updateLevelByIndex(${idx},this.value)\">${['Nominal','Ordinal','Scale'].map(v=>`<option ${meta[name].level===v?'selected':''}>${v}</option>`).join('')}</select></td><td>${unique}</td><td>${missing}</td></tr>`"""
          assert old2 in s
          s=s.replace(old2,new2)
          old3="""function updateLabel(encoded,val){const name=decodeURIComponent(encoded);meta[name].label=val}function updateLevel(encoded,val){const name=decodeURIComponent(encoded);meta[name].level=val;refreshScaleVariableSelect();advisor();analyze();renderPreviewHeadersOnly()}"""
          new3="""function updateLabelByIndex(index,val){const name=headers[index];if(!name)return;meta[name].label=val}function updateLevelByIndex(index,val){const name=headers[index];if(!name)return;meta[name].level=val;refreshScaleVariableSelect();advisor();analyze();renderPreviewHeadersOnly()}"""
          assert old3 in s
          s=s.replace(old3,new3)
          old4="""const scale=headers.filter(h=>meta[h].level==='Scale').length;const ordinal=headers.filter(h=>meta[h].level==='Ordinal').length;const nominal=headers.filter(h=>meta[h].level==='Nominal').length;let msg=`Measurement levels: <b>${scale} Scale</b>, <b>${ordinal} Ordinal</b>, <b>${nominal} Nominal</b>. `;if(scale>=2)msg+='You can explore correlation between scale variables. ';if(scale>=1&&(nominal+ordinal)>=1)msg+='To compare a scale outcome across groups, t-test or ANOVA may be appropriate depending on the number of groups and assumptions. ';if(scale===0)msg+='Frequency tables and contingency-table methods may be more suitable than mean-based analyses.'"""
          new4="""const scale=headers.filter(h=>meta[h].level==='Scale').length;const validScale=headers.filter(h=>meta[h].level==='Scale'&&types[h]==='numeric').length;const ordinal=headers.filter(h=>meta[h].level==='Ordinal').length;const nominal=headers.filter(h=>meta[h].level==='Nominal').length;let msg=`Measurement levels: <b>${scale} Scale</b>, <b>${ordinal} Ordinal</b>, <b>${nominal} Nominal</b>. `;if(scale>validScale)msg+=`<b>${scale-validScale}</b> Scale variable(s) are stored as text and cannot be used in numeric analyses until corrected. `;if(validScale>=2)msg+='You can explore correlation between numeric Scale variables. ';if(validScale>=1&&(nominal+ordinal)>=1)msg+='To compare a numeric Scale outcome across groups, t-test or ANOVA may be appropriate depending on the number of groups and assumptions. ';if(validScale===0)msg+='No numeric Scale variable is currently available for mean-based analyses.'"""
          assert old4 in s
          s=s.replace(old4,new4)
          p.write_text(s)
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix data import and metadata edge cases"
          git push
