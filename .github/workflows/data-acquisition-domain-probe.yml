name: Data Acquisition Domain Surface Probe

on:
  push:
    branches:
      - integration/data-acquisition-platform
    paths:
      - 'services/data-acquisition/config/domain_source_candidates.json'
      - 'services/data-acquisition/config/retail_commerce_core_patterns.json'
      - 'services/data-acquisition/tools/LIVE_DOMAIN_SURFACE_PROBE.py'
      - '.github/workflows/data-acquisition-domain-probe.yml'
  workflow_dispatch:

jobs:
  probe-public-surfaces:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-acquisition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run safe public-read-only surface probes
        run: python tools/LIVE_DOMAIN_SURFACE_PROBE.py --domains ota,coffee,q_diving,beauty,it_retail --output validation/domain-live-probe.json
      - name: Summarize result
        run: python -c "import json; x=json.load(open('validation/domain-live-probe.json',encoding='utf-8')); print(json.dumps(x['summary'],ensure_ascii=False,indent=2))"
      - name: Upload live probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: ku2d-domain-live-probe
          path: services/data-acquisition/validation/domain-live-probe.json
          if-no-files-found: error
          retention-days: 14
