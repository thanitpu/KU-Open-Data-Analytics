name: Gourmet Cross Runner Access Probe

on:
  push:
    branches:
      - integration/data-acquisition-platform
    paths:
      - '.github/workflows/gourmet-cross-runner-probe.yml'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: services/data-acquisition
        run: python -m pip install -r requirements.txt
      - name: Probe Gourmet public surfaces
        working-directory: services/data-acquisition
        env:
          PYTHONPATH: .
        run: python tools/LIVE_GOURMET_ENV_PROBE.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: gourmet-env-${{ matrix.os }}
          path: services/data-acquisition/gourmet-env-probe.json
          retention-days: 14
