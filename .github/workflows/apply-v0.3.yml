name: Apply v0.3 core analysis
on:
  push:
    branches: [feature/core-analysis-v0.3]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/core-analysis-v0.3
      - name: Apply v0.3 changes
        shell: bash
        run: |
          python - <<'PY'
            import base64,gzip,re,pathlib
            
            def dec(s): return gzip.decompress(base64.b64decode(s)).decode()
            views=dec('')
            stats=dec('')
            html=pathlib.Path('index.html').read_text()
            repls=[
            ('<title>KU Open Data Analytics v0.2</title>','<title>KU Open Data Analytics v0.3</title>'),
            ('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>','<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>\n<script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>'),
            ('<div class="nav">Descriptive Statistics</div><div class="nav">Explore & Visualize</div>','<div class="nav">Descriptive Statistics</div><div class="nav" onclick="showAnalysisView(\'frequency\')">Frequency Tables</div><div class="nav">Explore & Visualize</div>'),
            ('<div class="nav">t-tests · soon</div><div class="nav">ANOVA · soon</div>','<div class="nav" onclick="showAnalysisView(\'ttest\')">t-tests</div><div class="nav" onclick="showAnalysisView(\'anova\')">One-way ANOVA</div>'),
            ('<div class="nav">Correlation · soon</div>','<div class="nav" onclick="showAnalysisView(\'correlation\')">Correlation</div>'),
            ('</main></div>\n<script>',views+'\n</main></div>\n<script>'),
            ('renderVariables();refreshScaleVariableSelect();advisor();analyze()','renderVariables();refreshScaleVariableSelect();refreshAnalysisSelectors();advisor();analyze()'),
            ('async function handleFile(file){',stats+'\nasync function handleFile(file){')
            ]
            for a,b in repls:
                if a not in html: raise SystemExit('Missing anchor: '+a[:80])
                html=html.replace(a,b,1)
            pat=r"function showView\(view\)\{.*?\}\nfunction detectDelimiter"
            new="function showView(view){$('workspaceView').classList.toggle('hidden',view!=='workspace');$('variablesView').classList.toggle('hidden',view!=='variables');$('analysisView').classList.add('hidden');document.querySelectorAll('.analysis-panel').forEach(p=>p.classList.add('hidden'));document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));const navs=[...document.querySelectorAll('.nav')];(view==='workspace'?navs[0]:navs[1]).classList.add('active')}\nfunction showAnalysisView(name){if(!headers.length){alert('Import a dataset first.');return}$('workspaceView').classList.add('hidden');$('variablesView').classList.add('hidden');$('analysisView').classList.remove('hidden');document.querySelectorAll('.analysis-panel').forEach(p=>p.classList.add('hidden'));$(name+'Panel').classList.remove('hidden');refreshAnalysisSelectors()}\nfunction detectDelimiter"
            html,n=re.subn(pat,new,html,count=1,flags=re.S)
            if n!=1: raise SystemExit('showView replacement failed')
            pathlib.Path('index.html').write_text(html)
            pathlib.Path('tests/validation_dataset_v0.3.csv').write_text(dec('H4sIAAZ3eWoC/1WPyw6CMBBF93zLXbRDmRmWPhJ1YWLCFxBFZKEYxP+3ncLCNE2T09M7t6c9DtP4fVM+SjTXcepwSXv8zNj0HZp2Hj739joP46vw2MQlBHZgBnkch/5RkGH14AqsIMq4zLZAHCSAAs7dbfg+i5B9k2MYldmvItxC6sSkAlWrz3ahmqg6kMu+RGiYg41dsBquYxtLWtvUEe4s3f+ne2c3dYCUEE497YH3xpUTTGOXmp6yHz+l0DiA16QfgzEWNVABAAA='))
            pathlib.Path('tests/expected_results_v0.3.json').write_text(dec(''))
            pathlib.Path('tests/VALIDATION_v0.3.md').write_text(dec(''))
          PY
      - name: Commit generated files and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/apply-v0.3.yml
          git add -- index.html tests/validation_dataset_v0.3.csv tests/expected_results_v0.3.json tests/VALIDATION_v0.3.md
          git commit -m "Add v0.3 core statistical analyses and validation pack"
          git push origin HEAD:feature/core-analysis-v0.3
