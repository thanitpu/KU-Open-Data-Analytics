name: Data Acquisition Platform CI

on:
  push:
    branches:
      - integration/data-acquisition-platform
  pull_request:
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate architecture contract
        shell: bash
        run: |
          test -f docs/DATA_ACQUISITION_NORTH_STAR.md
          test -f services/data-acquisition/README.md
          grep -q 'Discover → Explore → Deep Audit → Human Approve → Scheduled Acquire' docs/DATA_ACQUISITION_NORTH_STAR.md
      - name: Compile platform foundation
        working-directory: services/data-acquisition
        run: python -m compileall -q platform tools/SELF_TEST_PLATFORM_FOUNDATION.py
      - name: Test observation store and lifecycle policy
        working-directory: services/data-acquisition
        env:
          PYTHONPATH: .
        run: python tools/SELF_TEST_PLATFORM_FOUNDATION.py
      - name: Run migrated service regressions when available
        working-directory: services/data-acquisition
        shell: bash
        run: |
          if [ ! -d acquisition ]; then
            echo 'Service migration not complete yet; service regressions skipped.'
            exit 0
          fi
          export KU2D_OPERATIONS_DB="$RUNNER_TEMP/ku2d_acquisition_ops.sqlite3"
          python -m compileall -q acquisition api repository tools
          python tools/SELF_TEST_LOTUS_v0.25.py
          python tools/SELF_TEST_SUPERMARKETS_v0.25.py
          python tools/SELF_TEST_TOPS_v0.27.py
          python tools/SELF_TEST_TOPS_AUDIT_v0.27.py
          python tools/SELF_TEST_GOURMET_v0.28.py
