name: Gourmet Market Live Acquisition Validation

on:
  push:
    branches:
      - integration/data-acquisition-platform
    paths:
      - '.github/workflows/data-acquisition-gourmet-live.yml'

permissions:
  contents: write

jobs:
  gourmet-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/data-acquisition-platform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Data Acquisition dependencies
        working-directory: services/data-acquisition
        run: python -m pip install -r requirements.txt
      - name: Record browser availability
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || true
      - name: Run live Gourmet Explore and Deep Audit
        working-directory: services/data-acquisition
        env:
          KU2D_OPERATIONS_DB: /tmp/ku2d_gourmet_live_ops.sqlite3
          KU2D_OBSERVATION_DB: /tmp/ku2d_gourmet_live_obs.sqlite3
          KU2D_GOURMET_RESULT: ../../docs/validation/gourmet-live-latest.json
          PYTHONPATH: .
        run: |
          rm -f "$KU2D_OPERATIONS_DB" "$KU2D_OBSERVATION_DB"
          python tools/LIVE_GOURMET_LIFECYCLE.py
      - name: Upload full live evidence
        uses: actions/upload-artifact@v4
        with:
          name: gourmet-live-validation
          path: |
            docs/validation/gourmet-live-latest.json
            /tmp/ku2d_gourmet_live_obs.sqlite3
          if-no-files-found: error
          retention-days: 30
      - name: Commit compact validation evidence
        shell: bash
        run: |
          git config user.name 'ku2d-acquisition-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/validation/gourmet-live-latest.json
          if git diff --cached --quiet; then
            echo 'No Gourmet validation evidence change.'
            exit 0
          fi
          git commit -m 'Record Gourmet Market live acquisition validation'
          git push origin HEAD:integration/data-acquisition-platform
