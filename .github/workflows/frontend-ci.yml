name: Frontend CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check src/state.js
          node --check src/journey.js
          node --check src/relationship-stats.js
          node --check src/data-profile.js
          node --check src/ai-analytics.js
          node --check src/app.js
          node --check src/analysis.js
      - name: Frontend smoke tests
        run: node tests/frontend_smoke.js
