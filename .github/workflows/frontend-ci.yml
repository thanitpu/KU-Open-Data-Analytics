name: Frontend CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    env:
      # Final architecture: index.html is Public Landing; app.html is the canonical Functional Product entry.
      KU_APP_ENTRY: app.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check src/state.js
          node --check src/journey.js
          node --check src/relationship-stats.js
          node --check src/profile-manifest.js
          node --check src/data-profile.js
          node --check src/ai-analytics.js
          node --check src/workflow-steps.js
          node --check src/result-drivers.js
          node --check src/result-details.js
          node --check src/accessibility.js
          node --check src/advanced-stats.js
          node --check src/app.js
          node --check src/analysis.js
          node --check src/landing-copy.js
          node --check src/landing-content.js
          node --check src/landing.js
          node --check tests/frontend_entry_guard.js
          node --check tests/landing_smoke.js
          node --check tests/ui_preferences_smoke.js
          node --check tests/frontend_file_loader_smoke.js
          node --check tests/frontend_dom_smoke.js
          node --check tests/frontend_ordinal_smoke.js
          node --check tests/profile_manifest_smoke.js
          node --check tests/public_product_visual_smoke.js
          node --check tests/responsive_sticky_smoke.js
          node --check tests/frontend_visual_smoke.js
      - name: Public and Product entry separation guard
        run: node tests/frontend_entry_guard.js
      - name: Landing static smoke
        run: node tests/landing_smoke.js
      - name: Product static smoke tests
        run: node tests/frontend_smoke.js
      - name: Local Profile Manifest smoke
        run: node tests/profile_manifest_smoke.js
      - name: Install frontend test dependencies
        run: npm install --no-save jsdom@24 playwright@1.55.0
      - name: Text-size preference smoke
        run: node tests/ui_preferences_smoke.js
      - name: CSV and XLSX loader smoke
        run: node tests/frontend_file_loader_smoke.js
      - name: Full journey DOM smoke
        run: node tests/frontend_dom_smoke.js
      - name: Ordinal target DOM smoke
        run: node tests/frontend_ordinal_smoke.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ku-open-da-http.log 2>&1 &
          echo $! >/tmp/ku-open-da-http.pid
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:4173/index.html" >/dev/null && curl -fsS "http://127.0.0.1:4173/${KU_APP_ENTRY}" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ku-open-da-http.log
          exit 1
      - name: Responsive sticky shell smoke
        run: node tests/responsive_sticky_smoke.js
      - name: Public to Product browser integration smoke
        run: node tests/public_product_visual_smoke.js
      - name: Functional responsive browser visual smoke
        run: node tests/frontend_visual_smoke.js
      - name: Upload visual UAT screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ku-open-da-visual-uat
          path: test-artifacts/visual-uat
          if-no-files-found: ignore
