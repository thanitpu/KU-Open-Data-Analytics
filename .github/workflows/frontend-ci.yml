name: Frontend CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    env:
      # Canonical Functional Analytics Application entry. Root index.html remains a temporary compatibility mirror until Landing promotion.
      KU_APP_ENTRY: app.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check src/state.js
          node --check src/journey.js
          node --check src/relationship-stats.js
          node --check src/data-profile.js
          node --check src/ai-analytics.js
          node --check src/workflow-steps.js
          node --check src/result-drivers.js
          node --check src/result-details.js
          node --check src/accessibility.js
          node --check src/advanced-stats.js
          node --check src/app.js
          node --check src/analysis.js
          node --check tests/frontend_entry_guard.js
          node --check tests/frontend_file_loader_smoke.js
          node --check tests/frontend_dom_smoke.js
          node --check tests/frontend_ordinal_smoke.js
          node --check tests/frontend_visual_smoke.js
      - name: App entry migration guard
        run: node tests/frontend_entry_guard.js
      - name: Static smoke tests
        run: node tests/frontend_smoke.js
      - name: Install frontend test dependencies
        run: npm install --no-save jsdom@24 playwright@1.55.0
      - name: CSV and XLSX loader smoke
        run: node tests/frontend_file_loader_smoke.js
      - name: Full journey DOM smoke
        run: node tests/frontend_dom_smoke.js
      - name: Ordinal target DOM smoke
        run: node tests/frontend_ordinal_smoke.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ku-open-da-http.log 2>&1 &
          echo $! >/tmp/ku-open-da-http.pid
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:4173/${KU_APP_ENTRY}" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ku-open-da-http.log
          exit 1
      - name: Responsive browser visual smoke
        run: node tests/frontend_visual_smoke.js
      - name: Upload visual UAT screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ku-open-da-visual-uat
          path: test-artifacts/visual-uat
          if-no-files-found: ignore
