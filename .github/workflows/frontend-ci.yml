name: Frontend CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    env:
      KU_APP_ENTRY: app.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: KU Open knowledge reference consumer smoke
        run: node tests/knowledge_reference_contract_smoke.js
      - name: Public and Product entry separation guard
        run: node tests/frontend_entry_guard.js
      - name: Landing static smoke
        run: node tests/landing_smoke.js
      - name: Product static smoke tests
        run: node tests/frontend_smoke.js
      - name: KU2D trusted data asset contract smoke
        run: node tests/ku2d_data_asset_smoke.js
      - name: Text analytics deterministic smoke
        run: node tests/text_analytics_smoke.js
      - name: Repository identity and rename guard
        run: node tests/repository_identity_smoke.js
      - name: Product shell profile wiring guard
        run: node tests/profile_shell_wiring_smoke.js
      - name: Local Profile Manifest smoke
        run: node tests/profile_manifest_smoke.js
      - name: Large dataset Profile Manifest smoke
        run: node tests/large_dataset_profile_smoke.js
      - name: Local Profile Insights smoke
        run: node tests/profile_insights_smoke.js
      - name: Analyze method selection smoke
        run: node tests/method_selection_smoke.js
      - name: Browser Feature Engineering Executor smoke
        run: node tests/fe_executor_smoke.js
      - name: Multi-method statistical engine smoke
        run: node tests/multi_method_smoke.js
      - name: Install frontend test dependencies
        run: npm install --no-save jsdom@24 playwright@1.55.0
      - name: Text-size preference smoke
        run: node tests/ui_preferences_smoke.js
      - name: CSV and XLSX loader smoke
        run: node tests/frontend_file_loader_smoke.js
      - name: KU2D intake browser smoke
        run: node tests/ku2d_intake_browser_smoke.js
      - name: Text analytics browser smoke
        run: node tests/text_analytics_browser_smoke.js
      - name: Full journey DOM smoke
        run: node tests/frontend_dom_smoke.js
      - name: Ordinal target DOM smoke
        run: node tests/frontend_ordinal_smoke.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ku-open-da-http.log 2>&1 &
          echo $! >/tmp/ku-open-da-http.pid
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:4173/index.html" >/dev/null && curl -fsS "http://127.0.0.1:4173/${KU_APP_ENTRY}" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ku-open-da-http.log
          exit 1
      - name: Step 2 profile insights browser smoke
        run: node tests/profile_insights_browser_smoke.js
      - name: Step 3 method selection browser smoke
        run: node tests/method_selection_browser_smoke.js
      - name: Step 4 FE recommendation + browser execution smoke
        run: node tests/fe_review_browser_smoke.js
      - name: Step 5-6 multi-method execution browser smoke
        run: node tests/multi_method_browser_smoke.js
      - name: Responsive sticky shell smoke
        run: node tests/responsive_sticky_smoke.js
      - name: Public to Product browser integration smoke
        run: node tests/public_product_visual_smoke.js
      - name: Functional responsive browser visual smoke
        run: node tests/frontend_visual_smoke.js
      - name: Upload visual UAT screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ku-open-da-visual-uat
          path: test-artifacts/visual-uat
          if-no-files-found: ignore
